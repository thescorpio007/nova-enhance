name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.out.outputs.apk }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Signing key
        env:
          NOVA_ENHANCE_KEY: ${{ secrets.NOVA_ENHANCE_KEY }}
        run: |
          if [ -z "$NOVA_ENHANCE_KEY" ]; then
            echo "::error title=Signing key missing::Add the NOVA_ENHANCE_KEY secret in Settings > Secrets and variables > Actions"
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keystore/nova-enhance.jks.enc \
            -out keystore/nova-enhance.jks -pass env:NOVA_ENHANCE_KEY || {
            echo "::error title=Signing key::NOVA_ENHANCE_KEY is set but could not open the key (check it was copied exactly)"; exit 1; }
          printf 'password=%s\n' "$NOVA_ENHANCE_KEY" > keystore/signing.properties
          echo "::notice title=Signing key::ready"

      - name: Build
        env:
          NOVA_BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: |error:" build.log | head -20 | while read -r l; do echo "::error::$l"; done
            exit 1
          }

      - id: out
        name: Find APK
        run: |
          f=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "apk=$(basename "$f")" >> "$GITHUB_OUTPUT"
          echo "APK: $f"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk

      - name: Checksums signed with the app's own key (the app checks them before updating)
        env:
          KP: ${{ secrets.NOVA_ENHANCE_KEY }}
        run: |
          set -e
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
          keytool -importkeystore -noprompt -srckeystore "$GITHUB_WORKSPACE/keystore/nova-enhance.jks" -srcalias novaenhance \
            -srcstorepass:env KP -srckeypass:env KP -destkeystore /tmp/k.p12 -deststoretype PKCS12 -deststorepass:env KP -destkeypass:env KP
          openssl pkcs12 -in /tmp/k.p12 -nocerts -nodes -passin env:KP -out /tmp/k.pem
          openssl pkcs12 -in /tmp/k.p12 -nokeys -clcerts -passin env:KP | openssl x509 -pubkey -noout > /tmp/pub.pem
          openssl dgst -sha256 -sign /tmp/k.pem -out SHA256SUMS.sig SHA256SUMS.txt
          openssl dgst -sha256 -verify /tmp/pub.pem -signature SHA256SUMS.sig SHA256SUMS.txt
          rm -f /tmp/k.p12 /tmp/k.pem
          echo "::notice title=Checksums::SHA256SUMS.txt signed and verified"

      - name: Release (marked pre-release until the emulator test passes)
        env:
          GH_TOKEN: ${{ github.token }}
          NOVA_BUILD: ${{ github.run_number }}
        run: |
          n=$(printf '%02d' "$NOVA_BUILD")
          cd app/build/outputs/apk/release
          gh release create "build-$n" *.apk SHA256SUMS.txt SHA256SUMS.sig \
            --title "Nova Enhance 1.0 · build $n" \
            --notes "Nova Enhance 1.0 · build $n — tap the .apk below to download and install. Designed by A.H" \
            --prerelease

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Short test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r apk/*.apk
            adb logcat -c
            adb shell am start -W -n com.nova.enhance/.MainActivity
            sleep 6
            adb shell am start -W -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT "hello this are a test" -n com.nova.enhance/.CaptureActivity
            sleep 5
            adb shell am start -W -a android.intent.action.PROCESS_TEXT -t text/plain --es android.intent.extra.PROCESS_TEXT "selected text" -n com.nova.enhance/.CaptureActivity
            sleep 5
            adb shell input keyevent 4
            sleep 2
            adb shell screencap -p /sdcard/shot.png
            adb pull /sdcard/shot.png shot.png
            adb logcat -d > logcat.txt
            if grep -q "FATAL EXCEPTION" logcat.txt; then grep -A 30 "FATAL EXCEPTION" logcat.txt; echo "::error title=Crash::the app crashed"; exit 1; fi
            adb shell am force-stop com.nova.enhance
            adb logcat -c
            adb shell am start -W -n com.nova.enhance/.MainActivity --es updtest "build-$(printf '%02d' ${{ github.run_number }})"
            for i in $(seq 1 24); do sleep 5; adb logcat -d -s NOVA_UPDTEST:I > updtest.txt; grep -q "PASS\|FAIL" updtest.txt && break; done; cat updtest.txt
            grep -q "PASS" updtest.txt || { echo "::error title=Update self-test::$(grep NOVA_UPDTEST updtest.txt | tail -1 | cut -c1-400)"; exit 1; }
            echo "::notice title=Update self-test::$(grep NOVA_UPDTEST updtest.txt | tail -1 | cut -c1-400)"
            adb shell pidof com.nova.enhance && echo "SHORT TEST OK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            logcat.txt
            shot.png

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Test passed — publish for the app's automatic updates
        env:
          GH_TOKEN: ${{ github.token }}
          NOVA_BUILD: ${{ github.run_number }}
        run: |
          n=$(printf '%02d' "$NOVA_BUILD")
          gh release edit "build-$n" --prerelease=false --latest -R "$GITHUB_REPOSITORY"
          echo "::notice title=Published::build-$n is now the latest release"
