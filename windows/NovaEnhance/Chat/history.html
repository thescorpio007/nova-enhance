<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Search history</title>
<link rel="stylesheet" href="chat.css">
<style>
body{overflow:hidden}
#wrap{height:100%;display:flex;flex-direction:column;padding:14px 18px;gap:9px}
.hd{display:flex;align-items:center;gap:10px}.hd b{font-size:17px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
#list,#detail{flex:1;overflow:auto;display:flex;flex-direction:column;gap:7px;padding-right:4px}
.it{flex-shrink:0;background:#181C24;border:1px solid #2A3040;border-radius:10px;padding:9px 12px;display:grid;grid-template-columns:52px 1fr auto;gap:2px 12px;align-items:center}
.it:hover{border-color:#3A4256}
.t{color:#9AA3B5;font-size:12px;grid-column:1;grid-row:1/3}.s{grid-column:2;grid-row:1;font-weight:600;color:#fff;overflow:hidden;white-space:normal;word-break:break-word;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.m{grid-column:2;grid-row:2;font-size:11.5px;color:#9AA3B5}.r{grid-column:3;grid-row:1/3;display:flex;gap:6px}
.ok{color:#3DDC97}.warn{color:#FFB547}.stop{color:#FF6B6B}
.foot{display:flex;align-items:center;gap:8px;color:#9AA3B5;font-size:12px;border-top:1px solid #2A3040;padding-top:9px;flex-wrap:wrap}
.q{font-size:16px;font-weight:600;color:#fff}
.ans{background:#181C24;border:1px solid #2A3040;border-radius:12px;padding:12px 16px;line-height:1.6;white-space:pre-wrap}
.src{font-size:12.5px;color:#B9B0FF;cursor:pointer;padding:3px 0}.src:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="wrap">
  <div class="hd"><b>🕘 Search history</b><span class="muted small">saved by itself — every question, answer and source</span></div>
  <div id="top">
    <input id="find" placeholder="🔍 Find in history: subject, words, document no.…">
    <div class="chips" id="chips" style="margin-top:8px"></div>
  </div>
  <div id="list"></div>
  <div id="detail" class="hide"></div>
  <div class="foot" id="foot"></div>
</div>
<script src="copyplain.js"></script>
<script src="rowmenu.js"></script>
<script src="history.js"></script>
</body>
</html>
