<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Nova Brain</title>
<link rel="stylesheet" href="chat.css">
<style>
body{overflow:hidden}
#top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #232836}#top b.t{font-size:19px}
.pill{border-radius:10px;padding:2px 9px;font-size:11.5px;font-weight:700}.pg{background:#16382A;color:#3DDC97}.pw{background:#3A3016;color:#FFB547}
#cols{display:grid;grid-template-columns:260px 1fr 440px;height:calc(100% - 56px)}
#secs{padding:10px}
.sec{padding:7px 10px;border-radius:8px;margin-bottom:2px;display:flex;justify-content:space-between;color:#C9CED8;cursor:pointer}.sec:hover{background:#1A1F2A}.sec.on{background:#232A3A;color:#fff;font-weight:600}
#mid{padding:14px 18px;overflow:auto}
#chat{border-left:1px solid #232836;display:flex;flex-direction:column;padding:12px;min-height:0}
#msgs2{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.card2{background:#181C24;border:1px solid #2A3040;border-radius:10px;padding:8px 13px;margin-bottom:8px}
.rule{display:grid;grid-template-columns:62px 1fr auto;gap:3px 10px;padding:7px 0;border-bottom:1px solid #232836;align-items:start}.rule:last-child{border:0}
.rule.off{opacity:.45}
.id{font-family:Consolas,monospace;color:#9AA3B5;font-size:11.5px}
.by{font-size:11px;color:#8B84D8}
.msg{border-radius:12px;padding:8px 12px;max-width:96%;line-height:1.45;white-space:pre-wrap}.me{background:#2E2A55;align-self:flex-end}.ai{background:#181C24;border:1px solid #2A3040}
.diff{font-family:Consolas,monospace;font-size:11.8px;line-height:1.5;background:#0F1218;border-radius:8px;padding:8px 10px;margin-top:6px;white-space:pre-wrap}
.add{color:#3DDC97}.del{color:#FF8A8A;text-decoration:line-through}.chg{color:#FFD27A}
.edit textarea{background:#0F1218;border:1px solid #2E3546;border-radius:6px;padding:6px;color:#ECEEF3;font-size:12.5px;min-height:46px}
#lock{position:fixed;inset:0;background:#12151C;display:flex;align-items:center;justify-content:center}
.box{width:520px;background:#161A22;border:1px solid #3A4256;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px}
table{width:100%;border-collapse:collapse;font-size:12.3px}th{background:#232A3A;color:#C9CED8;text-align:left;padding:6px 8px}td{padding:6px 8px;border-bottom:1px solid #232836}
.ok{color:#3DDC97}.bad{color:#FF6B6B}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#232A3A;border:1px solid #3A4256;border-radius:10px;padding:8px 16px;display:none}
#busy2{color:#B9B0FF;font-size:12px;min-height:16px}
select{background:#232A3A;color:#ECEEF3;border:0;border-radius:6px;padding:4px 8px}
button.testb{background:#F5B83D;color:#1A1300;font-weight:700;border-color:#F5B83D}
button:disabled{opacity:.38;cursor:not-allowed}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.opts button{white-space:normal;text-align:left}
.tbox{background:#10131B;border:1px solid #2E3448;border-radius:10px;padding:9px 10px;margin-top:8px;white-space:normal}
.tbox textarea.tq{width:100%;min-height:38px;background:#1A1E28;color:#E6E8EE;border:1px solid #2A3040;border-radius:7px;padding:6px 8px;font:inherit;font-size:12.5px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.side{background:#0B0E14;border-radius:8px;padding:7px 8px;font-size:12px;max-height:260px;overflow:auto}.side b{display:block;margin-bottom:4px}
.side .r{padding:2px 0;border-bottom:1px solid #1A1F2B}.side .r.plus{color:#3DDC97}.side .r.minus{color:#FF8A8A}.side .txt{white-space:pre-wrap;line-height:1.45}
.exr{display:grid;grid-template-columns:auto auto 1fr;gap:6px;align-items:start;padding:5px 0;border-bottom:1px solid #1E2433;font-size:12.5px}.exr .s{font-weight:600}.exr button{padding:2px 9px}.exr button.on{background:#7C6CFF;color:#fff}
.checks{font-size:12.5px;line-height:1.7;margin:6px 0}.chg{color:#FFD27A}
.verdict{border-radius:8px;padding:6px 10px;font-weight:700;margin-top:6px;font-size:13px}.verdict:empty{display:none}.verdict.passed{background:#12301F;color:#3DDC97;border:1px solid #1F5C38}.verdict.weak{background:#3A3016;color:#FFB547;border:1px solid #6A5520}.verdict.blocked{background:#3A1A1D;color:#FF8A8A;border:1px solid #6A2A30}
.tbadge{font-size:11px;color:#6B7385;white-space:nowrap}.tbadge.yes{color:#3DDC97}
.hk{background:#1B2030;border:1px solid #2A3040;border-radius:9px;padding:5px 14px;min-width:96px}.hk b{font-size:18px;display:block}
.lesson{background:#1E1B33;border:1px solid #4A42A0;border-radius:9px;padding:7px 10px;margin:6px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:12.5px}.lesson.bad2{background:#2A1416;border-color:#6A2A30}
.msg .by{margin-top:4px}
#bfiles{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}#bfiles:empty{display:none}
.fchip{display:inline-flex;align-items:center;gap:6px;background:#232A3A;border:1px solid #3A4256;border-radius:16px;padding:2px 4px 2px 10px;font-size:12px;max-width:100%}
.fchip .n{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fchip button{padding:1px 8px;font-size:11.5px;border-radius:12px}
.fchip button.g{background:#12301F;color:#3DDC97;border-color:#1F5C38}.fchip button.b{background:#3A1A1D;color:#FF8A8A;border-color:#6A2A30}.fchip.priv{border-color:#6A2A30;color:#FF8A8A}
#askBox.drag{border-color:#7C6CFF;background:#1E1B33}
.learned{background:#10131B;border:1px solid #2E3448;border-radius:9px;padding:6px 10px;margin-top:6px;font-size:12.5px;white-space:normal}.learned li{margin:2px 0}
</style>
</head>
<body>
<div id="top"><b class="t">🧠 Nova Brain</b><span id="pill"></span><span class="muted small" id="meta"></span><span class="grow"></span>
  <button id="bHealth">🩺 Health check</button><button id="bBackup">💾 Back up now</button><button id="bVers">🕘 Versions &amp; backups</button><button id="bLock">🔒 Lock</button></div>
<div id="cols">
  <div id="secsWrap" data-split="left" data-col="0" data-min="180" data-max="520" style="border-right:1px solid #232836;overflow:auto"><div id="secs"></div></div>
  <div id="mid"></div>
  <div id="chat" data-split="right" data-col="2" data-min="300" data-max="900">
    <div class="row"><b>🎓 Talk to the brain · trainer</b><span class="grow"></span><button id="bClear" title="start a new conversation (the rules stay)">✚ New</button></div>
    <div class="muted small" style="margin:2px 0 8px">tell it in your own words · it checks your real emails, asks when unclear, proposes the exact change · 🧪 TEST → ✓ Apply</div>
    <div id="lessons"></div>
    <div id="msgs2"></div>
    <div id="busy2"></div>
    <div id="askBox" style="background:#181C24;border:1px solid #2E3546;border-radius:10px;padding:6px 8px;margin-top:6px">
      <div id="bfiles"></div>
      <textarea id="ask" rows="3" placeholder="Write an instruction or a question — or 📎 add an example (email, PDF, Word…) and say “make a rule like this” (Enter = send · Shift+Enter = new line · drop or paste files here)"></textarea>
      <div class="row"><button id="bAttach" title="emails .msg / .eml, PDF, Word, Excel, text, pictures">📎 Example file</button><button id="bOutlook" title="the email selected in Outlook">✉ Outlook email</button><span class="grow"></span><button class="primary" id="send">Send</button></div>
    </div>
  </div>
</div>
<div id="lock" class="hide"><div class="box" id="lockBox"></div></div>
<div id="toast"></div>
<script src="copyplain.js"></script>
<script src="colresize.js"></script>
<script src="thinking.js"></script>
<script src="brain.js"></script>
<script src="split.js"></script>
</body>
</html>
